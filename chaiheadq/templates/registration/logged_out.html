{% extends "layout.html" %}

{% block title %}Logged Out - ChaiHeadQ{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5 text-center">
        <div class="card card-custom p-5 shadow-lg">
            <div class="mb-3 fs-1 text-warning">
                <i class="bi bi-cup-hot"></i>
            </div>
            <h3 class="fw-bold text-light mb-2">You Have Been Logged Out</h3>
            <p class="text-secondary mb-4 small">
                Thank you for visiting ChaiHeadQ. Take a sip of tea and return whenever you have fresh thoughts to share.
            </p>
            <div class="d-flex justify-content-center gap-2">
                <a href="/accounts/login/" class="btn btn-chai rounded-pill px-4">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Again
                </a>
                <a href="{% url 'tweet_list' %}" class="btn btn-outline-secondary rounded-pill px-4">
                    <i class="bi bi-house me-1"></i> Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
